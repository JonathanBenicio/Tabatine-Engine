name: Mutation Tests (Stryker.NET)

on:
  # Execução manual sob demanda
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Projeto alvo para mutação (padrão: Infrastructure)'
        required: false
        default: 'Tabatine.Infrastructure'

  # Execução agendada mensalmente (todo dia 1 às 3h UTC)
  schedule:
    - cron: '0 3 1 * *'

  # Também roda em PRs para main (apenas quando arquivos de lógica mudam)
  pull_request:
    branches:
      - main
    paths:
      - 'src/Tabatine.Infrastructure/Services/**'
      - 'src/Tabatine.Infrastructure/Repositories/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Credenciais mínimas necessárias para o build (sem acesso real ao ERP)
  Omie__AppKey: 'ci-placeholder'
  Omie__AppSecret: 'ci-placeholder'
  Omie__BaseUrl: 'https://app.omie.com.br/api/v1'
  ConnectionStrings__DefaultConnection: 'Host=localhost;Database=ci_test;Username=ci;Password=ci'
  Telegram__BotToken: 'ci-placeholder'
  Telegram__WebhookUrl: 'https://placeholder.example.com'
  Telegram__WebhookSecret: 'ci-placeholder'

jobs:
  mutation-test:
    name: 🧬 Stryker — Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 📦 Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🔄 Restore dependencies
        run: dotnet restore src/TabatineEngine.sln

      - name: 🛠️ Restore local tools (Stryker)
        run: dotnet tool restore

      - name: 🧬 Run Stryker Mutation Tests
        run: |
          dotnet stryker \
            --project src/Tabatine.Infrastructure/Tabatine.Infrastructure.csproj \
            --config-file src/Tabatine.Infrastructure/stryker-config.json
        # Stryker retorna exit code 1 se Mutation Score < break threshold (40%)

      - name: 📊 Upload Stryker HTML Report
        uses: actions/upload-artifact@v4
        if: always() # Faz upload mesmo se o Stryker falhar (para diagnóstico)
        with:
          name: stryker-mutation-report-${{ github.run_number }}
          path: src/Tabatine.Infrastructure/StrykerOutput
          retention-days: 30

      - name: 📝 Comment Mutation Score on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/Tabatine.Infrastructure/StrykerOutput';
            
            let body = '## 🧬 Stryker Mutation Testing\n\n';
            
            // Tenta ler o relatório JSON para extrair o mutation score
            const jsonFiles = fs.readdirSync(path, { recursive: true })
              .filter(f => f.toString().endsWith('.json'));
              
            if (jsonFiles.length > 0) {
              try {
                const reportData = JSON.parse(fs.readFileSync(`${path}/${jsonFiles[0]}`, 'utf8'));
                const score = reportData.mutationScore ?? 'N/A';
                const survived = reportData.survived ?? '?';
                const killed = reportData.killed ?? '?';
                const total = reportData.totalMutants ?? '?';
                
                const emoji = score >= 75 ? '🟢' : score >= 50 ? '🟡' : '🔴';
                body += `${emoji} **Mutation Score:** ${score}%\n\n`;
                body += `| Métrica | Valor |\n|---------|-------|\n`;
                body += `| Mutantes Mortos | ${killed} |\n`;
                body += `| Mutantes Sobrevividos | ${survived} |\n`;
                body += `| Total de Mutantes | ${total} |\n\n`;
              } catch (e) {
                body += '⚠️ Não foi possível parsear o relatório JSON do Stryker.\n\n';
              }
            }
            
            body += '📄 [Baixar relatório HTML completo nos artefatos da execução](' +
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - tabatine-worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  Omie__AppKey: ${{ secrets.OMIE_APPKEY }}
  Omie__AppSecret: ${{ secrets.OMIE_APPSECRET }}
  Omie__BaseUrl: ${{ secrets.OMIE_BASEURL }}
  ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build src/Tabatine.Worker/Tabatine.Worker.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Tabatine.Worker/Tabatine.Worker.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_65A93618ED1B4EDE899790776431E66A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DA63F70D898A4A2F8806DE9A7D454C93 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7FA2DD4B6D3844C1B6D35E65069FDF47 }}

      - name: Configure Azure Web App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'tabatine-worker'
          app-settings-json: |
            [
              {
                "name": "Omie__AppKey",
                "value": "${{ secrets.OMIE_APPKEY }}",
                "slotSetting": false
              },
              {
                "name": "Omie__AppSecret",
                "value": "${{ secrets.OMIE_APPSECRET }}",
                "slotSetting": false
              },
              {
                "name": "Omie__BaseUrl",
                "value": "${{ secrets.OMIE_BASEURL }}",
                "slotSetting": false
              },
              {
                "name": "ConnectionStrings__DefaultConnection",
                "value": "${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tabatine-worker'
          slot-name: 'Production'
          package: .
          startup-command: 'dotnet Tabatine.Worker.dll'
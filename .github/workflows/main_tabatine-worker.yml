# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - tabatine-worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/Tabatine.Worker/**'
      - 'src/Tabatine.Core/**'
      - 'src/Tabatine.Infrastructure/**'
      - 'src/Tabatine.Omie.Client/**'
      - '.github/workflows/main_tabatine-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/Tabatine.Worker/**'
      - 'src/Tabatine.Core/**'
      - 'src/Tabatine.Infrastructure/**'
      - 'src/Tabatine.Omie.Client/**'
      - '.github/workflows/main_tabatine-worker.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  Omie__AppKey: ${{ secrets.OMIE_APPKEY }}
  Omie__AppSecret: ${{ secrets.OMIE_APPSECRET }}
  Omie__BaseUrl: ${{ secrets.OMIE_BASEURL }}
  ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION }}
  Telegram__BotToken: ${{ secrets.TELEGRAM_BOTTOKEN }}
  Telegram__WebhookUrl: ${{ secrets.TELEGRAM_WEBHOOKURL }}
  Telegram__WebhookSecret: ${{ secrets.TELEGRAM_WEBHOOKSECRET }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build src/TabatineEngine.sln --configuration Release

      - name: Test with dotnet
        run: dotnet test src/TabatineEngine.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Cobertura'

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coveragereport/Cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '50 75'

      - name: Write Coverage to Step Summary
        run: |
          echo "## Resumo de Cobertura de Código" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY


      - name: dotnet publish
        run: dotnet publish src/Tabatine.Worker/Tabatine.Worker.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_65A93618ED1B4EDE899790776431E66A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DA63F70D898A4A2F8806DE9A7D454C93 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7FA2DD4B6D3844C1B6D35E65069FDF47 }}

      - name: Configure Azure Web App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'tabatine-worker'
          app-settings-json: |
            [
              {
                "name": "Omie__AppKey",
                "value": "${{ secrets.OMIE_APPKEY }}",
                "slotSetting": false
              },
              {
                "name": "Omie__AppSecret",
                "value": "${{ secrets.OMIE_APPSECRET }}",
                "slotSetting": false
              },
              {
                "name": "Omie__BaseUrl",
                "value": "${{ secrets.OMIE_BASEURL }}",
                "slotSetting": false
              },
              {
                "name": "ConnectionStrings__DefaultConnection",
                "value": "${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION }}",
                "slotSetting": false
              },
              {
                "name": "Telegram__BotToken",
                "value": "${{ secrets.TELEGRAM_BOTTOKEN }}",
                "slotSetting": false
              },
              {
                "name": "Telegram__WebhookUrl",
                "value": "${{ secrets.TELEGRAM_WEBHOOKURL }}",
                "slotSetting": false
              },
              {
                "name": "Telegram__WebhookSecret",
                "value": "${{ secrets.TELEGRAM_WEBHOOKSECRET }}",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tabatine-worker'
          slot-name: 'Production'
          package: .
          startup-command: 'dotnet Tabatine.Worker.dll'
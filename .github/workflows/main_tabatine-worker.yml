# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CI/CD - Tabatine Engine

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main_tabatine-worker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main_tabatine-worker.yml'
  schedule:
    - cron: '0 3 1 * *' # Execução agendada mensalmente (todo dia 1 às 3h UTC)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_VERSION: '10.x'
  # Credenciais para Testes (Placeholder em CI, Secrets em produção)
  Omie__AppKey: ${{ secrets.OMIE_APPKEY || 'ci-placeholder' }}
  Omie__AppSecret: ${{ secrets.OMIE_APPSECRET || 'ci-placeholder' }}
  Omie__BaseUrl: ${{ secrets.OMIE_BASEURL || 'https://app.omie.com.br/api/v1' }}
  # Credenciais de Sandbox para Testes E2E
  Omie__AppKey_Sandbox: ${{ secrets.OMIE_APPKEY_SANDBOX || 'sandbox-placeholder' }}
  Omie__AppSecret_Sandbox: ${{ secrets.OMIE_APPSECRET_SANDBOX || 'sandbox-placeholder' }}
  Omie__BaseUrl_Sandbox: ${{ secrets.OMIE_BASEURL_SANDBOX || 'https://app.omie.com.br/api/v1/' }}
  ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION || 'Host=localhost;Database=ci;Username=ci;Password=ci' }}

jobs:
  # 🛡️ Job: Build - Validação de compilação
  build:
    name: 🛡️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/TabatineEngine.sln

      - name: Build
        run: dotnet build src/TabatineEngine.sln --configuration Release --no-restore

  # 🧪 Job: Test - Testes Integrados e Cobertura
  test:
    name: 🧪 Unit & Integrated Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test src/TabatineEngine.sln --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: 'coverage/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Cobertura'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coveragereport/Cobertura.xml
          badge: true
          fail_below_min: false 
          format: markdown
          output: both
          thresholds: '50 75'

      - name: Write Summary
        run: |
          echo "## 📊 Resumo de Cobertura de Código" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  # 🧬 Job: Stryker - Testes de Mutação (PRs ou manual)
  mutation-test:
    name: 🧬 Stryker Mutation
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker
        working-directory: src/Tabatine.Infrastructure
        run: dotnet stryker --project Tabatine.Infrastructure.csproj --config-file stryker-config.json

      - name: 📝 Comment Mutation Score on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportDir = 'src/Tabatine.Infrastructure/StrykerOutput/reports';
            const jsonPath = path.join(reportDir, 'mutation-report.json');
            let body = '## 🧬 Stryker Mutation Testing\n\n';

            if (!fs.existsSync(jsonPath)) {
              body += '⚠️ Relatório JSON não encontrado — Stryker pode ter falhado.\n\n';
            } else {
              try {
                const raw = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                // Schema do Stryker.NET: { schemaVersion, thresholds, projectRoot, files }
                let killed = 0, survived = 0, timeout = 0, noCoverage = 0, total = 0;

                for (const [, data] of Object.entries(raw.files || {})) {
                  for (const mutant of data.mutants || []) {
                    total++;
                    if (mutant.status === 'Killed')     killed++;
                    if (mutant.status === 'Survived')   survived++;
                    if (mutant.status === 'Timeout')    timeout++;
                    if (mutant.status === 'NoCoverage') noCoverage++;
                  }
                }

                const score = total > 0 ? Math.round(((killed + timeout) / total) * 100) : 0;
                const thresholds = raw.thresholds || { high: 75, low: 50, break: 40 };
                const emoji = score >= thresholds.high ? '🟢' : score >= thresholds.low ? '🟡' : '🔴';

                body += `${emoji} **Mutation Score: ${score}%**\n\n`;
                body += `| Métrica | Valor |\n|---------|-------|\n`;
                body += `| ✅ Mortos | ${killed} |\n`;
                body += `| ❌ Sobrevividos | ${survived} |\n`;
                body += `| ⏱️ Timeout | ${timeout} |\n`;
                body += `| 🔇 Sem Cobertura | ${noCoverage} |\n`;
                body += `| 📊 Total | ${total} |\n\n`;
                body += `**Quality Gate:** 🟢 ≥${thresholds.high}% | 🟡 ≥${thresholds.low}% | 💀 break <${thresholds.break}%\n\n`;

                if (score < thresholds.break) {
                  body += `> ⛔ **FALHOU** — Score abaixo do limite de ${thresholds.break}%\n\n`;
                } else {
                  body += `> ✅ Quality Gate passou.\n\n`;
                }
              } catch (e) {
                body += `⚠️ Erro ao processar relatório: ${e.message}\n\n`;
              }
            }

            body += `📄 [Ver artefatos](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Upload Stryker Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: src/Tabatine.Infrastructure/StrykerOutput

  # 📦 Job: Publish - Preparação do artefato de Deploy
  publish:
    name: 📦 Publish
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish src/Tabatine.Worker/Tabatine.Worker.csproj -c Release -o ./publish-output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish-output

  # 🚀 Job: Deploy - Azure Web App
  deploy:
    name: 🚀 Deploy to Azure
    runs-on: ubuntu-latest
    needs: [publish]
    if: |
      needs.publish.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_65A93618ED1B4EDE899790776431E66A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DA63F70D898A4A2F8806DE9A7D454C93 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7FA2DD4B6D3844C1B6D35E65069FDF47 }}

      - name: Configure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'tabatine-worker'
          app-settings-json: |
            [
              { "name": "Omie__AppKey", "value": "${{ secrets.OMIE_APPKEY }}", "slotSetting": false },
              { "name": "Omie__AppSecret", "value": "${{ secrets.OMIE_APPSECRET }}", "slotSetting": false },
              { "name": "Omie__BaseUrl", "value": "${{ secrets.OMIE_BASEURL }}", "slotSetting": false },
              { "name": "ConnectionStrings__DefaultConnection", "value": "${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION }}", "slotSetting": false },
              { "name": "Telegram__BotToken", "value": "${{ secrets.TELEGRAM_BOTTOKEN }}", "slotSetting": false },
              { "name": "Telegram__WebhookUrl", "value": "${{ secrets.TELEGRAM_WEBHOOKURL }}", "slotSetting": false },
              { "name": "Telegram__WebhookSecret", "value": "${{ secrets.TELEGRAM_WEBHOOKSECRET }}", "slotSetting": false }
            ]

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tabatine-worker'
          slot-name: 'Production'
          package: .
          startup-command: 'dotnet Tabatine.Worker.dll'